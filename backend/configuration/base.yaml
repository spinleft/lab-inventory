application:
  port: 8000
  host: 0.0.0.0
  base_url: http://127.0.0.1:8000
  # Origin the browser app is served from. QR codes link here, so a phone
  # scanning a label lands on the SPA rather than on the API.
  public_web_url: http://127.0.0.1:5173
  hmac_secret: super-long-and-secret-random-key-needed-to-verify-message-integrity
  cookie_secure: false
  enable_federation: true
  # Refuse to start while `root` still carries the password seeded by the
  # migrations. Turned on by production.yaml; off here so tests and local
  # development are not blocked by it.
  require_root_password_rotation: false
  cors_allowed_origins:
  - http://localhost:5173
  - http://127.0.0.1:5173
  - http://localhost:3000
  - tauri://localhost
  - http://tauri.localhost
  - https://tauri.localhost
database:
  host: 127.0.0.1
  port: 5432
  username: postgres
  password: password
  database_name: lab_inventory
  require_ssl: false
  # Apply pending migrations on start. Off here because scripts/init_db owns
  # the local schema; production.yaml turns it on.
  run_migrations: false
redis_uri: redis://127.0.0.1:6379
file_storage:
  backend: local
  local_root: ./storage/attachments
  max_file_size_bytes: 52428800
  upload_token_ttl_minutes: 60
federation:
  enabled: true
  public_base_url: http://127.0.0.1:8000
  require_https: true
  allow_insecure_private_network: false
  request_ttl_seconds: 300
  allowed_remote_hosts: []
label_printing:
  # Printers live on the LAN, so private addresses are allowed. Loopback is not,
  # unless this is turned on for local development against a fake printer.
  allow_loopback: false
