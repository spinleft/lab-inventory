[package]
name = "lab-inventory"
version = "0.1.0"
authors = ["spinleft <spinleftgit@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Inventory management system for laboratories"
homepage = "https://github.com/spinleft/lab-inventory"
repository = "https://github.com/spinleft/lab-inventory"
license = "MIT"
readme = "../README.md"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "lab-inventory"

[[bin]]
path = "src/bin/admin.rs"
name = "lab-inventory-admin"

[dependencies]
actix-cors = "0.7"
actix-multipart = "0.7"
actix-session = { version = "0.11", features = ["redis-session-rustls"] }
actix-web = "4"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.23"
chrono = { version = "0.4.22", default-features = false, features = ["clock", "serde"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
futures-util = "0.3"
hmac = "0.12"
rand = { version = "0.8", features = ["std_rng"] }
redis = { version = "0.32", features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-aux = "4"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
unicode-segmentation = "1.13"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
validator = "0.20"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
    "cookies",
] }
claims = "0.8"
fake = "2.9"
quickcheck = "1.1"
quickcheck_macros = "1"
