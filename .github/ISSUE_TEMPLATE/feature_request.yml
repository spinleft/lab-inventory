name: 功能建议
description: 提一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你在实际使用中遇到的困难,而不是直接描述方案
      placeholder: 现在要 ... 的时候,必须 ...,这很麻烦,因为 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
      description: 你觉得应该怎么做
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 现在是怎么绕过去的?为什么不够用?

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 你所在实验室的规模、使用场景等,有助于判断优先级
