# cargo-deny 配置,由 .github/workflows/audit.yml 使用。
#
#     cargo install cargo-deny
#     cargo deny --manifest-path backend/Cargo.toml check

[advisories]
# 未修复的漏洞一律失败;确实无法处理的,在这里逐条豁免并写清原因。
yanked = "deny"
ignore = []

[licenses]
# 项目本身是 MIT。允许的都是宽松许可,不会传染到使用方。
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots 携带的 Mozilla CA 根证书清单用的是这个。它是数据许可,
    # 不是代码许可,对使用方没有传染性。
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
