<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under the notch and the gesture
         bar; the layout pays it back with env(safe-area-inset-*) padding.
         maximum-scale is deliberately absent: pinch-zoom stays available. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Lab Inventory</title>
    <!-- Rewritten by the container at start-up; see public/config.js. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
