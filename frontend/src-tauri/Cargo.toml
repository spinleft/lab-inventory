[package]
name = "lab-inventory-client"
version = "0.1.2"
description = "Client for lab inventory management system"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lab_inventory_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 安卓包里 95% 的体积是这个库编译出的 .so(每个 ABI 一份),所以这里按体积调,
# 不按速度调。外壳本身只做 IPC 转发和原生 HTTP 请求,计算量都在 WebView 和后端,
# opt-level="z" 的性能损失在这个应用里量不出来。
#
# panic="abort" 去掉展开表(.eh_frame / .gcc_except_table)。代价是 panic 不再能被
# 捕获:tokio 里 spawn 的任务 panic 会直接终止进程,而不是变成 JoinError。对一个
# WebView 外壳来说,那种 panic 本来也没法继续。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

