server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Attachment uploads pass through this proxy, so the limit has to clear the
    # backend's own file_storage.max_file_size_bytes (50 MiB by default).
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset file names, so they can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Read on every load and rewritten on every container start.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        # Substituted by docker-entrypoint.sh from API_UPSTREAM.
        proxy_pass __API_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Attachment downloads stream, so buffering them here would only add
        # latency and disk churn.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Client-side routing: any unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
